# Coletor do ecossistema (T14). Sobe com deploy/docker-compose.monitoramento.yml, que monta este arquivo, alertas.yml e os dois
# segredos de coleta. Nada aqui é público: as APIs só aceitam a coleta com a credencial própria e o Caddy bloqueia /monitoramento/*.
global:
  scrape_interval: 30s
rule_files:
  - /etc/prometheus/alertas.yml
alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]
scrape_configs:
  - job_name: servirea
    metrics_path: /monitoramento/metrics
    follow_redirects: false
    authorization:
      type: Monitoring
      credentials_file: /run/secrets/servirea_monitoramento
    static_configs:
      - targets: [servirea-api:8080]
  - job_name: central
    metrics_path: /monitoramento/metrics
    follow_redirects: false
    authorization:
      type: Monitoring
      credentials_file: /run/secrets/central_monitoramento
    static_configs:
      - targets: [central-api:8081]

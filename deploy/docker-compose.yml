# Produção na VPS (27/09/2026): as duas APIs e o Caddy (HTTPS automático).
# Layout em /opt/ecossistema (ver deploy/README.md):
#   servirea-api-back/  servirea-api-front/  central-api-back/  central-api-front/
#   servirea.env  central.env  (segredos, chmod 600, fora do git)
#   sites/servirea  sites/central  (fronts compilados pelo atualizar.sh)
# As APIs não publicam porta: só o Caddy fala com a internet (80/443).
name: ecossistema

services:
  servirea-api:
    build: ../../servirea-api-back
    env_file: ../../servirea.env
    environment:
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75
      SPRING_DATASOURCE_HIKARI_MAXIMUMPOOLSIZE: 5
      SERVIRE_INTEGRACAO_CENTRAL_URL: http://central-api:8081
    networks:
      default:
        # Nome antigo (até 30/09/2026): a URL de integração do produto fica no banco da Central.
        aliases:
          - servire-api
    mem_limit: 1536m
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  central-api:
    build: ..
    env_file: ../../central.env
    environment:
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75
      SPRING_DATASOURCE_HIKARI_MAXIMUMPOOLSIZE: 5
    mem_limit: 1024m
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  # WhatsApp (27/09/2026): EvolutionGo, sem porta publicada. A Central chama http://evolution:4000; o QR code
  # é lido em whatsapp.servirea.com.br (Caddy com usuário e senha + a chave da API na tela da Evolution).
  evolution:
    image: evoapicloud/evolution-go:0.7.2
    env_file: ../../evolution.env
    environment:
      SERVER_PORT: "4000"
      CLIENT_NAME: servirea
      PASSKEY_PUBLIC_URL: https://whatsapp.servirea.com.br
      DATABASE_SAVE_MESSAGES: "false"
      CONNECT_ON_STARTUP: "true"
      OS_NAME: Servirea
      EVENT_IGNORE_GROUP: "true"
      EVENT_IGNORE_STATUS: "true"
      DEBUG_ENABLED: INFO
      LOG_TYPE: console
      GIN_MODE: release
    volumes:
      - evolution_data:/app/dbdata
    depends_on:
      - evolution-db
    mem_limit: 512m
    restart: unless-stopped

  evolution-db:
    image: postgres:17-alpine
    env_file: ../../evolution-db.env
    volumes:
      - evolution_pg:/var/lib/postgresql/data
    mem_limit: 256m
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../../sites:/srv:ro
      - caddy_data:/data
      - caddy_config:/config
    # Usuário e hash (base64) do acesso ao whatsapp.servirea.com.br.
    env_file: ../../caddy.env
    depends_on:
      - servirea-api
      - central-api
      - evolution
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
  evolution_data:
  evolution_pg:

name: Testar e publicar

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/estado-projeto.json'
      - 'scripts/verificar-docs.py'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: producao
  cancel-in-progress: false

jobs:
  testar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Testes (o Testcontainers sobe o Postgres)
        run: mvn -B -q verify
      - name: Scripts de release e rollback (sandbox, sem Docker nem VPS)
        run: bash deploy/testes/release.test.sh

  publicar:
    needs: testar
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Publicar na VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          if [ -z "$VPS_HOST" ] || [ -z "$VPS_USER" ] || [ -z "$VPS_SSH_KEY" ] || [ -z "$VPS_KNOWN_HOSTS" ]; then
            echo "Faltam os secrets VPS_HOST, VPS_USER, VPS_SSH_KEY e VPS_KNOWN_HOSTS. Produção não foi alterada."
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          # A chave só consegue rodar o atualizar.sh (comando fixo no authorized_keys da VPS).
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" "atualizar"

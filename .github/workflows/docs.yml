name: Validar documentação
on:
  push:
    paths: ['**/*.md', 'docs/estado-projeto.json', 'scripts/verificar-docs.py', 'scripts/gerar-schema.ps1', 'src/main/resources/db/migration/**', 'schema.sql', '.github/workflows/docs.yml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  documentos:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/verificar-docs.py

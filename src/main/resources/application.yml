spring:
  application:
    name: central-api
  threads:
    virtual:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: false

central:
  security:
    jwt:
      access-token-ttl: PT15M
      secret: ${CENTRAL_JWT_SEGREDO}
    refresh-token-ttl: P30D
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  integracao:
    chaves-entrada: ${CENTRAL_PRODUTO_SERVIRE_CHAVES_ENTRADA:}
    chave-saida-id: ${CENTRAL_PRODUTO_SERVIRE_CHAVE_SAIDA_ID:}
    chave-saida-segredo: ${CENTRAL_PRODUTO_SERVIRE_CHAVE_SAIDA_SEGREDO:}

server:
  port: ${PORT:8081}
  forward-headers-strategy: none

management:
  endpoints:
    web:
      exposure:
        include: health,info

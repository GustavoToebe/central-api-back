spring:
  application:
    name: central-api
  threads:
    virtual:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: false

central:
  mercadopago:
    access-token: ${MP_ACCESS_TOKEN:}
    webhook-secret: ${MP_WEBHOOK_SECRET:}
    collector-id: ${MP_COLLECTOR_ID:}
    retorno-url: ${MP_RETORNO_URL:}
    notificacao-url: ${MP_NOTIFICACAO_URL:}
    producao: ${MP_PRODUCAO:false}
  security:
    jwt:
      access-token-ttl: PT15M
      secret: ${CENTRAL_JWT_SEGREDO}
    refresh-token-ttl: P30D
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
    # Domínio do cookie CENTRAL-XSRF-TOKEN. Vazio = só o host da API (dev, mesmo host).
    csrf:
      cookie-domain: ${CENTRAL_CSRF_COOKIE_DOMAIN:}
  integracao:
    chaves-entrada: ${CENTRAL_PRODUTO_SERVIRE_CHAVES_ENTRADA:}
    chave-saida-id: ${CENTRAL_PRODUTO_SERVIRE_CHAVE_SAIDA_ID:}
    chave-saida-segredo: ${CENTRAL_PRODUTO_SERVIRE_CHAVE_SAIDA_SEGREDO:}

server:
  port: ${PORT:8081}
  forward-headers-strategy: none

management:
  metrics:
    web:
      server:
        max-uri-tags: 256
  endpoints:
    web:
      exposure:
        include: health,info

# Desabilitado sem credencial exclusiva válida; nunca usa JWT de operador.
monitoramento:
  token: ${MONITORAMENTO_TOKEN:}
